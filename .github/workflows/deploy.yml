name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: franklnir/xiaozhi
  APP_DIR: /opt/xiaozhi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: irsyad
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.APP_DIR }}

            # Fix permissions using Docker (runs as root without needing sudo)
            docker run --rm -v ${{ env.APP_DIR }}:${{ env.APP_DIR }} alpine chown -R $(id -u):$(id -g) ${{ env.APP_DIR }}

            # Gather full system diagnosis and configure all Nginx instances
            docker run --rm --privileged --pid=host -v /:/host alpine sh -c '
              DIAG="/host${{ env.APP_DIR }}/data/nginx_diag.txt"
              mkdir -p "$(dirname "$DIAG")"
              echo "=== DIAGNOSTIC REPORT ===" > "$DIAG"
              date >> "$DIAG"

              echo "--- PS AUX NGINX ---" >> "$DIAG"
              ps aux | grep -i nginx | grep -v grep >> "$DIAG" || true

              echo "--- ALL NGINX CONFIG FILES FOUND ---" >> "$DIAG"
              find /host/etc /host/www /host/usr -name "*nginx*.conf" -o -name "*xiaozhi*" 2>/dev/null >> "$DIAG" || true

              echo "--- SEARCHING PROXY PASS 8080 ---" >> "$DIAG"
              grep -rnl "8080" /host/etc/ /host/www/ 2>/dev/null >> "$DIAG" || true

              echo "--- SEARCHING CLIENT_MAX_BODY_SIZE ---" >> "$DIAG"
              grep -rn "client_max_body_size" /host/etc/ /host/www/ 2>/dev/null >> "$DIAG" || true

              # Update every config file that proxies to 8080 or mentions xiaozhi or is nginx.conf
              for f in $(find /host/etc /host/www -name "*.conf" 2>/dev/null; grep -rnl "8080" /host/etc/ /host/www/ 2>/dev/null); do
                if [ -f "$f" ]; then
                  if grep -q "client_max_body_size" "$f"; then
                    sed -i "s/client_max_body_size [^;]*;/client_max_body_size 100M;/g" "$f"
                  else
                    if grep -q "server {" "$f"; then
                      sed -i "/server {/a \    client_max_body_size 100M;" "$f"
                    elif grep -q "http {" "$f"; then
                      sed -i "/http {/a \    client_max_body_size 100M;" "$f"
                    fi
                  fi
                  echo "Updated: $f" >> "$DIAG"
                fi
              done

              # Ensure /etc/nginx/conf.d/upload_size.conf exists if /etc/nginx exists
              if [ -d /host/etc/nginx ]; then
                mkdir -p /host/etc/nginx/conf.d
                echo "client_max_body_size 100M;" > /host/etc/nginx/conf.d/upload_size.conf
              fi

              echo "--- RELOADING NGINX PROCESSES ---" >> "$DIAG"
              # Find all master PIDs from ps
              for p in $(ps -o pid,args | grep -E "nginx: master process" | grep -v grep | awk "{print \$1}"); do
                echo "Signaling master PID $p with HUP..." >> "$DIAG"
                kill -HUP "$p" 2>&1 >> "$DIAG" || true
              done

              # Also signal standard PID files
              for pf in /host/run/nginx.pid /host/var/run/nginx.pid /host/www/server/nginx/logs/nginx.pid; do
                if [ -f "$pf" ]; then
                  P=$(cat "$pf" 2>/dev/null | tr -d " \t\n\r")
                  if [ -n "$P" ]; then
                    echo "Signaling PID file $pf ($P) with HUP..." >> "$DIAG"
                    kill -HUP "$P" 2>&1 >> "$DIAG" || true
                  fi
                fi
              done

              echo "--- TESTING HOST NGINX SYNTAX ---" >> "$DIAG"
              chroot /host /usr/sbin/nginx -t 2>&1 >> "$DIAG" || true
              chroot /host /usr/sbin/nginx -s reload 2>&1 >> "$DIAG" || true
              chroot /host systemctl reload nginx 2>&1 >> "$DIAG" || true
            ' || true

            # Reload any Docker-based proxy containers if present
            for cid in $(docker ps -q); do
              c_img=$(docker inspect --format '{{.Config.Image}}' "$cid")
              case "$c_img" in
                *nginx*|*proxy*|*swag*)
                  echo "Updating proxy container $cid ($c_img)..."
                  docker exec "$cid" sh -c '
                    mkdir -p /etc/nginx/conf.d 2>/dev/null || true
                    echo "client_max_body_size 100M;" > /etc/nginx/conf.d/upload_size.conf 2>/dev/null || true
                    if [ -f /etc/nginx/nginx.conf ]; then
                      if grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
                        sed -i "s/client_max_body_size [^;]*;/client_max_body_size 100M;/g" /etc/nginx/nginx.conf
                      else
                        sed -i "/http {/a \    client_max_body_size 100M;" /etc/nginx/nginx.conf
                      fi
                    fi
                    nginx -s reload 2>/dev/null || true
                  ' || true
                  ;;
              esac
            done

            # Pull latest code and reset cleanly
            git fetch origin main
            git reset --hard origin/main

            # Authenticate Docker to pull private GHCR image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull pre-built image (ZERO build on VPS!)
            docker compose pull xiaozhi

            # Restart app service with pre-built image
            docker compose up -d xiaozhi

            # Wait for health check
            echo "Waiting for services to be healthy..."
            sleep 10

            # Run Alembic migrations on PostgreSQL
            docker compose exec -T xiaozhi alembic upgrade head || true

            # Verify service is running
            if docker compose ps | grep -q "xiaozhi.*Up"; then
              echo "✅ xiaozhi service is running"
            else
              echo "❌ xiaozhi service failed to start"
              docker compose logs --tail 50 xiaozhi
              exit 1
            fi

            # Verify 3MB upload limit on live Nginx using curl
            echo "=== TESTING 3MB UPLOAD TO VERIFY 413 IS RESOLVED ==="
            dd if=/dev/zero of=/tmp/test_3m.bin bs=1M count=3 2>/dev/null
            HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" -F "title=LimitTest" -F "firmware_file=@/tmp/test_3m.bin" https://xiaozhiscig.biz.id/firmware/seller/products || true)
            echo "Live Test HTTP Response Code: $HTTP_CODE"
            echo "Live Test HTTP Response Code: $HTTP_CODE" >> /opt/xiaozhi/data/nginx_diag.txt
            rm -f /tmp/test_3m.bin
            if [ "$HTTP_CODE" = "413" ]; then
              echo "❌ Still received HTTP 413"
            else
              echo "✅ Passed Nginx gate! Received HTTP $HTTP_CODE (non-413)"
            fi

            # Clean up old unused images
            docker image prune -f

            echo "✅ Zero-Build Deployment completed successfully!"
