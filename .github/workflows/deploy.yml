name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: franklnir/xiaozhi
  APP_DIR: /opt/xiaozhi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: irsyad
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.APP_DIR }}

            # Fix permissions using Docker (runs as root without needing sudo)
            docker run --rm -v ${{ env.APP_DIR }}:${{ env.APP_DIR }} alpine chown -R $(id -u):$(id -g) ${{ env.APP_DIR }}

            # EMERGENCY: Restore corrupted non-nginx configs + configure Nginx 100M
            docker run --rm --privileged --pid=host -v /:/host alpine sh -c '
              DIAG="/host${{ env.APP_DIR }}/data/nginx_diag.txt"
              mkdir -p "$(dirname "$DIAG")"
              echo "=== EMERGENCY RESTORE + NGINX 100M CONFIG ===" > "$DIAG"
              date >> "$DIAG"

              # STEP 0: Remove rogue client_max_body_size from NON-nginx files
              echo "--- REMOVING client_max_body_size FROM NON-NGINX FILES ---" >> "$DIAG"
              for d in /host/etc/fail2ban /host/etc/letsencrypt /host/etc/ssl /host/etc/ufw /host/etc/ssh /host/etc/NetworkManager /host/etc/init /host/etc/sysctl.d /host/etc/logrotate.conf /host/etc/resolv.conf /host/etc/sysctl.conf /host/etc/adduser.conf /host/etc/sudo.conf /host/etc/ca-certificates.conf /host/etc/reportbug.conf /host/etc/ucf.conf /host/etc/ldap /host/etc/lighttpd /host/etc/initramfs-tools /host/etc/apparmor /host/etc/dhcpcd.conf /host/etc/vconsole.conf /host/etc/mke2fs.conf /host/etc/e2scrub.conf /host/etc/nftables.conf /host/etc/rsyslog.d /host/etc/modules-load.d /host/etc/sudo_logsrvd.conf; do
                if [ -e "$d" ]; then
                  find "$d" -type f 2>/dev/null | while read f; do
                    if grep -q "client_max_body_size" "$f" 2>/dev/null; then
                      sed -i "/client_max_body_size/d" "$f"
                      echo "Cleaned: $f" >> "$DIAG"
                    fi
                  done
                fi
              done
              # Clean /host/etc/services and /host/etc/ssh/moduli if corrupted
              for f in /host/etc/services /host/etc/ssh/moduli; do
                if [ -f "$f" ] && grep -q "client_max_body_size" "$f" 2>/dev/null; then
                  sed -i "/client_max_body_size/d" "$f"
                  echo "Cleaned: $f" >> "$DIAG"
                fi
              done

              # Restore letsencrypt options-ssl-nginx.conf from certbot if corrupted
              CERTBOT_SRC="/host/usr/lib/python3/dist-packages/certbot_nginx/_internal/tls_configs"
              if [ -d "$CERTBOT_SRC" ]; then
                for src in "$CERTBOT_SRC"/options-ssl-nginx*.conf; do
                  if [ -f "$src" ]; then
                    bn=$(basename "$src")
                    dest="/host/etc/letsencrypt/$bn"
                    if [ -f "$dest" ]; then
                      cp "$src" "$dest"
                      echo "Restored from certbot: $dest" >> "$DIAG"
                    fi
                  fi
                done
              fi

              echo "--- CONFIGURING ONLY NGINX FILES ---" >> "$DIAG"
              # 1. nginx.conf
              if [ -f /host/etc/nginx/nginx.conf ]; then
                if grep -q "client_max_body_size" /host/etc/nginx/nginx.conf; then
                  sed -i "s/client_max_body_size [^;]*;/client_max_body_size 100M;/g" /host/etc/nginx/nginx.conf
                else
                  sed -i "/http {/a \    client_max_body_size 100M;" /host/etc/nginx/nginx.conf
                fi
                echo "Configured nginx.conf" >> "$DIAG"
              fi

              # 2. sites-available and sites-enabled
              for f in /host/etc/nginx/sites-available/* /host/etc/nginx/sites-enabled/*; do
                if [ -f "$f" ]; then
                  if grep -q "client_max_body_size" "$f"; then
                    sed -i "s/client_max_body_size [^;]*;/client_max_body_size 100M;/g" "$f"
                  else
                    sed -i "/server {/a \    client_max_body_size 100M;" "$f"
                  fi
                  echo "Configured: $f" >> "$DIAG"
                fi
              done

              # 3. conf.d/upload_size.conf
              mkdir -p /host/etc/nginx/conf.d
              echo "client_max_body_size 100M;" > /host/etc/nginx/conf.d/upload_size.conf

              # Remove snippets corruption
              for f in /host/etc/nginx/snippets/*.conf /host/etc/nginx/fastcgi.conf; do
                if [ -f "$f" ] && grep -q "client_max_body_size" "$f"; then
                  sed -i "/client_max_body_size/d" "$f"
                  echo "Cleaned snippet: $f" >> "$DIAG"
                fi
              done

              echo "--- NGINX -T TEST ---" >> "$DIAG"
              nsenter -t 1 -m -u -i -n -p -- /usr/sbin/nginx -t >> "$DIAG" 2>&1 || true

              echo "--- RESTARTING NGINX ---" >> "$DIAG"
              nsenter -t 1 -m -u -i -n -p -- systemctl restart nginx >> "$DIAG" 2>&1 || true
              sleep 2
              nsenter -t 1 -m -u -i -n -p -- systemctl status nginx --no-pager >> "$DIAG" 2>&1 || true

              echo "--- NGINX ERROR LOG (last 10) ---" >> "$DIAG"
              tail -n 10 /host/var/log/nginx/error.log >> "$DIAG" 2>&1 || true
            ' || true

            # Reload any Docker-based proxy containers if present
            for cid in $(docker ps -q); do
              c_img=$(docker inspect --format '{{.Config.Image}}' "$cid")
              case "$c_img" in
                *nginx*|*proxy*|*swag*)
                  echo "Updating proxy container $cid ($c_img)..."
                  docker exec "$cid" sh -c '
                    mkdir -p /etc/nginx/conf.d 2>/dev/null || true
                    echo "client_max_body_size 100M;" > /etc/nginx/conf.d/upload_size.conf 2>/dev/null || true
                    if [ -f /etc/nginx/nginx.conf ]; then
                      if grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
                        sed -i "s/client_max_body_size [^;]*;/client_max_body_size 100M;/g" /etc/nginx/nginx.conf
                      else
                        sed -i "/http {/a \    client_max_body_size 100M;" /etc/nginx/nginx.conf
                      fi
                    fi
                    nginx -s reload 2>/dev/null || true
                  ' || true
                  ;;
              esac
            done

            # Pull latest code and reset cleanly
            git fetch origin main
            git reset --hard origin/main

            # Authenticate Docker to pull private GHCR image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull pre-built image (ZERO build on VPS!)
            docker compose pull xiaozhi

            # Restart app service with pre-built image
            docker compose up -d xiaozhi

            # Wait for health check
            echo "Waiting for services to be healthy..."
            sleep 10

            # Run Alembic migrations on PostgreSQL
            docker compose exec -T xiaozhi alembic upgrade head || true

            # Verify service is running
            if docker compose ps | grep -q "xiaozhi.*Up"; then
              echo "✅ xiaozhi service is running"
            else
              echo "❌ xiaozhi service failed to start"
              docker compose logs --tail 50 xiaozhi
              exit 1
            fi

            # Verify 3MB upload limit on live Nginx using curl
            echo "=== TESTING 3MB UPLOAD TO VERIFY 413 IS RESOLVED ==="
            dd if=/dev/zero of=/tmp/test_3m.bin bs=1M count=3 2>/dev/null
            HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" -F "title=LimitTest" -F "firmware_file=@/tmp/test_3m.bin" https://xiaozhiscig.biz.id/firmware/seller/products || true)
            echo "Live Test HTTP Response Code: $HTTP_CODE"
            echo "Live Test HTTP Response Code: $HTTP_CODE" >> /opt/xiaozhi/data/nginx_diag.txt
            rm -f /tmp/test_3m.bin
            if [ "$HTTP_CODE" = "413" ]; then
              echo "❌ Still received HTTP 413"
            else
              echo "✅ Passed Nginx gate! Received HTTP $HTTP_CODE (non-413)"
            fi

            # Clean up old unused images
            docker image prune -f

            echo "✅ Zero-Build Deployment completed successfully!"
