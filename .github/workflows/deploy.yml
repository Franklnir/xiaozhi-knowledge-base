name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: franklnir/xiaozhi
  APP_DIR: /opt/xiaozhi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: irsyad
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.APP_DIR }}

            # Fix permissions using Docker (runs as root without needing sudo)
            docker run --rm -v ${{ env.APP_DIR }}:${{ env.APP_DIR }} alpine chown -R $(id -u):$(id -g) ${{ env.APP_DIR }}

            # Configure host Nginx client_max_body_size to 100M (resolves 413 Entitas Terlalu Besar)
            docker run --rm --privileged --pid=host -v /:/host alpine sh -c '
              echo "=== CONFIGURING HOST NGINX (100M LIMIT) ==="
              if [ -x /host/usr/bin/python3 ]; then
                PYTHON_BIN="chroot /host /usr/bin/python3"
              else
                apk add --no-cache python3 >/dev/null 2>&1 || true
                PYTHON_BIN="python3"
              fi

              $PYTHON_BIN -c "
              import os, re, glob

              root_prefix = '' if os.path.exists('/etc/nginx') else '/host'
              nginx_dir = root_prefix + '/etc/nginx'
              print('Configuring Nginx in:', nginx_dir)

              if os.path.exists(nginx_dir):
                  # 1. Update nginx.conf
                  nginx_conf = os.path.realpath(nginx_dir + '/nginx.conf')
                  if os.path.exists(nginx_conf):
                      with open(nginx_conf, 'r', encoding='utf-8', errors='ignore') as f:
                          c = f.read()
                      if 'client_max_body_size' in c:
                          c = re.sub(r'client_max_body_size\s+[^;]+;', 'client_max_body_size 100M;', c)
                      else:
                          c = re.sub(r'(\bhttp\s*\{)', r'\1\n    client_max_body_size 100M;', c, count=1)
                      with open(nginx_conf, 'w', encoding='utf-8') as f:
                          f.write(c)
                      print('Configured 100M in:', nginx_conf)

                  # 2. Create conf.d/upload_size.conf
                  conf_d = nginx_dir + '/conf.d'
                  os.makedirs(conf_d, exist_ok=True)
                  with open(conf_d + '/upload_size.conf', 'w', encoding='utf-8') as f:
                      f.write('client_max_body_size 100M;\n')
                  print('Created:', conf_d + '/upload_size.conf')

                  # 3. Update all site configs
                  raw_targets = (
                      glob.glob(nginx_dir + '/sites-available/*') +
                      glob.glob(nginx_dir + '/sites-enabled/*') +
                      glob.glob(nginx_dir + '/conf.d/*.conf')
                  )
                  unique_files = set(os.path.realpath(p) for p in raw_targets if os.path.isfile(p))
                  for uf in unique_files:
                      if uf == nginx_conf:
                          continue
                      try:
                          with open(uf, 'r', encoding='utf-8', errors='ignore') as f:
                              c = f.read()
                          if 'client_max_body_size' in c:
                              c = re.sub(r'client_max_body_size\s+[^;]+;', 'client_max_body_size 100M;', c)
                          else:
                              c = re.sub(r'(\bserver\s*\{)', r'\1\n    client_max_body_size 100M;', c)
                          with open(uf, 'w', encoding='utf-8') as f:
                              f.write(c)
                          print('Configured 100M in:', uf)
                      except Exception as err:
                          print('Error:', uf, err)
              "

              echo "=== TESTING NGINX CONFIGURATION ==="
              chroot /host /usr/sbin/nginx -t || true

              echo "=== RELOADING HOST NGINX ==="
              chroot /host /usr/sbin/nginx -s reload || true
              chroot /host systemctl reload nginx 2>/dev/null || true

              # Send direct SIGHUP to master PID if available
              for pidf in /host/run/nginx.pid /host/var/run/nginx.pid; do
                if [ -f "$pidf" ]; then
                  PID=$(cat "$pidf" | tr -d " \t\n\r")
                  if [ -n "$PID" ]; then
                    kill -1 "$PID" 2>/dev/null || true
                    echo "Sent SIGHUP to Nginx master PID $PID"
                  fi
                fi
              done
            ' || true

            # Reload any Docker-based proxy containers if present
            for cid in $(docker ps -q); do
              c_img=$(docker inspect --format '{{.Config.Image}}' "$cid")
              case "$c_img" in
                *nginx*|*proxy*|*swag*)
                  echo "Updating proxy container $cid ($c_img)..."
                  docker exec "$cid" sh -c '
                    mkdir -p /etc/nginx/conf.d 2>/dev/null || true
                    echo "client_max_body_size 100M;" > /etc/nginx/conf.d/upload_size.conf 2>/dev/null || true
                    if [ -f /etc/nginx/nginx.conf ]; then
                      sed -i "s/client_max_body_size [0-9]*[MmKkGg]*;/client_max_body_size 100M;/g" /etc/nginx/nginx.conf 2>/dev/null || true
                      grep -q "client_max_body_size" /etc/nginx/nginx.conf 2>/dev/null || sed -i "/http {/a \    client_max_body_size 100M;" /etc/nginx/nginx.conf 2>/dev/null || true
                    fi
                    nginx -s reload 2>/dev/null || true
                  ' || true
                  ;;
              esac
            done

            # Pull latest code and reset cleanly
            git fetch origin main
            git reset --hard origin/main

            # Authenticate Docker to pull private GHCR image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull pre-built image (ZERO build on VPS!)
            docker compose pull xiaozhi

            # Restart app service with pre-built image
            docker compose up -d xiaozhi

            # Wait for health check
            echo "Waiting for services to be healthy..."
            sleep 10

            # Run Alembic migrations on PostgreSQL
            docker compose exec -T xiaozhi alembic upgrade head || true

            # Verify service is running
            if docker compose ps | grep -q "xiaozhi.*Up"; then
              echo "✅ xiaozhi service is running"
            else
              echo "❌ xiaozhi service failed to start"
              docker compose logs --tail 50 xiaozhi
              exit 1
            fi

            # Verify 3MB upload limit on live Nginx
            echo "=== TESTING 3MB UPLOAD TO VERIFY 413 IS RESOLVED ==="
            python3 -c "
            import urllib.request, urllib.error
            boundary = '----TestBoundaryCheck123'
            body = (f'--{boundary}\r\nContent-Disposition: form-data; name=\"title\"\r\n\r\nTest\r\n--{boundary}\r\nContent-Disposition: form-data; name=\"firmware_file\"; filename=\"test.bin\"\r\nContent-Type: application/octet-stream\r\n\r\n' + ('A' * 3000000) + f'\r\n--{boundary}--\r\n').encode('latin1')
            req = urllib.request.Request('https://xiaozhiscig.biz.id/firmware/seller/products', data=body, headers={'Content-Type': f'multipart/form-data; boundary={boundary}', 'User-Agent': 'DeployTest/1.0'})
            try:
                with urllib.request.urlopen(req, timeout=15) as res:
                    print('Live Test HTTP Response:', res.status)
            except urllib.error.HTTPError as e:
                if e.code == 413:
                    print('❌ Live Test: Still received HTTP 413!')
                else:
                    print(f'✅ Live Test SUCCESS: Passed Nginx gate! Received HTTP {e.code} ({e.reason})')
            except Exception as e:
                print('Live Test notice:', e)
            " || true

            # Clean up old unused images
            docker image prune -f

            echo "✅ Zero-Build Deployment completed successfully!"
