name: Deploy to VPS

on:
  push:
    branches: [main]

env:
  APP_DIR: /opt/xiaozhi

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: irsyad
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.APP_DIR }}
            
            # Pull latest changes
            git pull origin main
            
            # Check if .env exists
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found!"
              echo "Please create .env from .env.example"
              exit 1
            fi
            
            # Build and restart services using production config
            docker compose down
            docker compose up -d --build
            
            # Wait for health check
            echo "Waiting for services to be healthy..."
            sleep 15
            
            # Check if app is running
            if docker compose ps | grep -q "xiaozhi.*Up"; then
              echo "✅ xiaozhi service is running"
            else
              echo "❌ xiaozhi service failed to start"
              docker compose logs xiaozhi
              exit 1
            fi
            
            # Clean up old images
            docker system prune -f
            
            echo "✅ Deployment complete!"
