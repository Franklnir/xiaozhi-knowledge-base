name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: franklnir/xiaozhi
  APP_DIR: /opt/xiaozhi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: irsyad
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.APP_DIR }}

            # Fix permissions using Docker (runs as root without needing sudo)
            docker run --rm -v ${{ env.APP_DIR }}:${{ env.APP_DIR }} alpine chown -R $(id -u):$(id -g) ${{ env.APP_DIR }}

            # Pull latest code and reset cleanly
            git fetch origin main
            git reset --hard origin/main

            # Authenticate Docker to pull private GHCR image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull pre-built image (ZERO build on VPS!)
            docker compose pull xiaozhi

            # Restart app service with pre-built image
            docker compose up -d xiaozhi

            # Wait for health check
            echo "Waiting for services to be healthy..."
            sleep 10

            # Run Alembic migrations on PostgreSQL
            docker compose exec -T xiaozhi alembic upgrade head || true

            # Verify service is running
            if docker compose ps | grep -q "xiaozhi.*Up"; then
              echo "✅ xiaozhi service is running"
            else
              echo "❌ xiaozhi service failed to start"
              docker compose logs --tail 50 xiaozhi
              exit 1
            fi

            # Clean up old unused images
            docker image prune -f

            echo "✅ Zero-Build Deployment completed successfully!"
