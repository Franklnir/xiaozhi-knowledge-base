name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: franklnir/xiaozhi
  APP_DIR: /opt/xiaozhi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy immutable image to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: irsyad
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd ${{ env.APP_DIR }}
            chmod 600 .env .db-admin.env
            find . -maxdepth 1 -type f -name '.env.*' -exec chmod 600 {} \;

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export XIAOZHI_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            docker compose pull xiaozhi
            docker run --rm \
              --network xiaozhi_default \
              --env-file .env \
              --env-file .db-admin.env \
              "$XIAOZHI_IMAGE" alembic upgrade head
            docker compose up -d --no-deps xiaozhi

            attempt=0
            until [ "$(docker inspect --format '{{.State.Health.Status}}' xiaozhi 2>/dev/null || true)" = "healthy" ]; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 24 ]; then
                docker compose logs --tail 100 xiaozhi
                exit 1
              fi
              sleep 5
            done

            curl --fail --silent --show-error \
              -H 'Host: xiaozhiscig.biz.id' \
              http://127.0.0.1:8080/login >/dev/null
            docker exec -e PYTHONPATH=/app xiaozhi \
              python /app/scripts/smoke_runtime_role.py
            docker logout ghcr.io >/dev/null 2>&1 || true
