services:
  postgres:
    image: postgres:16-alpine
    container_name: xiaozhi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xiaozhi
      POSTGRES_USER: xiaozhi_app
      POSTGRES_PASSWORD: xiaozhi_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaozhi_app -d xiaozhi"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
    driver: local
