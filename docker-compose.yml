services:
  xiaozhi:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: xiaozhi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:7860"
    environment:
      - APP_SECRET_KEY=[REDACTED_APP_SECRET_KEY]=
      - DATA_ENCRYPTION_KEY=[REDACTED_DATA_ENCRYPTION_KEY]=
      - ADMIN_USERNAME=irsyad03
      - ADMIN_PASSWORD=[REDACTED_ADMIN_PASSWORD]
      - RESTORED_USER_USERNAME=irsyad26
      - RESTORED_USER_PASSWORD=[REDACTED_USER_PASSWORD]
      - DB_BACKEND=sqlite
      - SQLITE_DB_PATH=/app/data/xiaozhi.db
      - ENVIRONMENT=production
      - ALLOWED_HOSTS=163.61.58.235,localhost,xiaozhiscig.biz.id,www.xiaozhiscig.biz.id
    volumes:
      - .:/app
    mem_limit: 512m
    memswap_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
