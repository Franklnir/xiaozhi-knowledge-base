<!doctype html>
<html lang="id"{% if default_ui_theme != 'default' %} data-theme="{{ default_ui_theme }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Xiaozhi Indonesia{% endblock %}</title>
    <meta name="title" content="{% block meta_title %}Xiaozhi Indonesia{% endblock %}">
    <meta name="description" content="{% block meta_desc %}Asisten suara Xiaozhi Indonesia{% endblock %}">
    <link rel="icon" type="image/png" href="/static/img/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/app.min.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link rel="stylesheet" href="/static/css/pwa-install.css">
    <script defer src="/static/js/pwa-install.js"></script>
    {% if default_ui_theme == 'playful' %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/css/playful.css">
    {% elif default_ui_theme in ('clay', 'clay-dark') %}
    <link rel="stylesheet" href="/static/css/claymorphism.css?v=3">
    {% endif %}
    {% block auth_assets %}{% endblock %}
</head>
<body>
    {% include "partials/pwa_install.html" %}
    <main class="app-auth-shell">
        {% block content_login %}{% endblock %}
    </main>
</body>
</html>
