<div id="materialProgressModal" class="dash-modal-backdrop" role="dialog" aria-modal="true">
    <div class="dash-modal-box" style="max-width: 460px; text-align: center; padding: 28px 24px;">
        <div style="width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 50%; background: #ecfdf5; border: 2px solid #047857; display: flex; align-items: center; justify-content: center;" class="text-emerald-700">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <h3 id="matProgStepTitle" style="font-size: 17px; font-weight: 800; color: var(--app-text); margin: 0 0 6px;">
            Memproses Vektorisasi Materi...
        </h3>
        <p id="matProgMessage" style="font-size: 12.5px; color: var(--app-muted); margin: 0 0 18px; line-height: 1.5;">
            Menghubungkan ke SSE pipeline fast indexing...
        </p>

        <!-- Progress bar track -->
        <div style="background: rgba(0,0,0,0.08); border: 2px solid var(--app-border-strong); border-radius: 99px; height: 16px; overflow: hidden; position: relative; margin-bottom: 10px;">
            <div id="matProgressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #047857, #10b981, #34d399); transition: width 0.35s ease; border-radius: 99px;"></div>
        </div>

        <div style="display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; color: var(--app-muted);">
            <span id="matProgPercent">0%</span>
            <span class="flex items-center gap-1">
                <svg class="dash-icon text-emerald-600" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                <span>SSE FastMCP Stream</span>
            </span>
        </div>
    </div>
</div>
